<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1C3D33">
  <title>Order Received — Qlassique Wellness</title>
  <meta name="description" content="Your Qlassique Wellness order has been received.">
  <link rel="icon" href="favicon.png" type="image/png" />
  <style>
    :root{--forest:#1C3D33;--cream:#F2EDE4;--gold:#C9A96E}
    *{box-sizing:border-box}
    body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:var(--forest);color:var(--cream);font:300 16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
    main{max-width:560px}
    p{max-width:42ch;margin:16px auto 0}
    h1{font:500 clamp(2rem,6vw,3rem)/1.15 Georgia,serif;margin:16px 0 0}
    .eyebrow{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
    .actions{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:34px}
    a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:14px 28px;text-decoration:none;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.72rem}
    a.btn-gold{background:var(--gold);color:#1c1a14}
    a.btn-outline{background:transparent;color:var(--cream);border:1px solid rgba(242,237,228,.55)}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Qlassique Wellness</p>
    <h1>Thank You for Your Order</h1>
    <p>Your payment has been received successfully.</p>
    <p>Qlassique Wellness will contact you regarding your order and delivery.</p>
    <div class="actions">
      <a class="btn btn-gold" href="shop.html">Continue Shopping</a>
      <a class="btn btn-outline" href="index.html">Return Home</a>
    </div>
  </main>
</body>
</html>
